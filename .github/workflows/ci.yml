name: CI-CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::800460064208:role/course-management-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t course-management:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag course-management:${{ github.sha }} \
          800460064208.dkr.ecr.us-east-1.amazonaws.com/course-management:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
          800460064208.dkr.ecr.us-east-1.amazonaws.com/course-management:${{ github.sha }}

      - name: Deploy to EC2 with SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d970fc119f5bb6ce" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy course-management ${{ github.sha }}" \
            --parameters 'commands=[
              "DB_HOST=$(aws ssm get-parameter --name /course-management/db/host --query Parameter.Value --output text)",
              "DB_USER=$(aws ssm get-parameter --name /course-management/db/user --query Parameter.Value --output text)",
              "DB_PASSWORD=$(aws ssm get-parameter --name /course-management/db/password --with-decryption --query Parameter.Value --output text)",
              "DB_NAME=$(aws ssm get-parameter --name /course-management/db/name --query Parameter.Value --output text)",
              "DB_PORT=$(aws ssm get-parameter --name /course-management/db/port --query Parameter.Value --output text)",
              "USE_RDS=$(aws ssm get-parameter --name /course-management/app/use-rds --query Parameter.Value --output text)",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 800460064208.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 800460064208.dkr.ecr.us-east-1.amazonaws.com/course-management:${{ github.sha }}",
              "docker stop course-management-app || true",
              "docker rm course-management-app || true",
              "docker run -d --restart unless-stopped -p 5000:5000 --name course-management-app --log-driver awslogs --log-opt awslogs-region=us-east-1 --log-opt awslogs-group=/course-management/app --log-opt awslogs-stream=course-management-app -e USE_RDS=$USE_RDS -e DB_HOST=$DB_HOST -e DB_USER=$DB_USER -e DB_PASSWORD=$DB_PASSWORD -e DB_NAME=$DB_NAME -e DB_PORT=$DB_PORT 800460064208.dkr.ecr.us-east-1.amazonaws.com/course-management:${{ github.sha }}",
              "for i in $(seq 1 10); do curl -fsS http://localhost:5000/health && exit 0; sleep 3; done; exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0d970fc119f5bb6ce"

          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0d970fc119f5bb6ce"
