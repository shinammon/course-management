name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::800460064208:role/course-management-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t course-management:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag course-management:${{ github.sha }} \
          800460064208.dkr.ecr.us-east-1.amazonaws.com/course-management:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
          800460064208.dkr.ecr.us-east-1.amazonaws.com/course-management:${{ github.sha }}