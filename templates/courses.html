{% extends "base.html" %}

{% block title %}課程管理 | Course Management{% endblock %}

{% block head %}
<style>
    .course-toolbar {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr;
        gap: 14px;
        margin-bottom: 24px;
    }

    .course-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
    }

    .course-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .course-image {
        width: 100%;
        height: 190px;
        object-fit: cover;
        background: #f3f4f6;
        display: block;
    }

    .course-image-placeholder {
        height: 190px;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 14px;
    }

    .course-content {
        padding: 20px;
    }

    .course-title {
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #111827;
    }

    .course-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .tag {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
    }

    .tag-category {
        background: #eff6ff;
        color: #1d4ed8;
    }

    .tag-level {
        background: #fff7e6;
        color: #b45309;
    }

    .course-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 50px 20px;
        color: #6b7280;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
    }

    .course-count {
        margin-bottom: 16px;
        color: #6b7280;
        font-size: 14px;
    }

    @media (max-width: 1000px) {
        .course-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .course-toolbar {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 650px) {
        .course-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="page-header">
    <h1>課程管理</h1>
    <p>查看目前系統中的課程，並依名稱、分類與程度進行篩選。</p>
</div>

<div class="course-toolbar">
    <input
        id="searchInput"
        class="form-control"
        type="text"
        placeholder="搜尋課程名稱..."
    >

    <select id="categoryFilter" class="form-control">
        <option value="">全部分類</option>
    </select>

    <select id="levelFilter" class="form-control">
        <option value="">全部程度</option>
    </select>
</div>

<div id="courseCount" class="course-count"></div>

<div id="courseGrid" class="course-grid">
    <div class="course-empty">
        載入課程資料中...
    </div>
</div>

{% endblock %}


{% block scripts %}
<script>
let allCourses = [];

const courseGrid = document.getElementById("courseGrid");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const levelFilter = document.getElementById("levelFilter");
const courseCount = document.getElementById("courseCount");


async function loadCourses() {
    try {
        const response = await fetch("/courses");

        if (!response.ok) {
            throw new Error("無法取得課程資料");
        }

        allCourses = await response.json();

        buildFilters();
        renderCourses(allCourses);

    } catch (error) {
        console.error(error);

        courseGrid.innerHTML = `
            <div class="course-empty error-message">
                課程資料載入失敗
            </div>
        `;
    }
}


function buildFilters() {
    const categories = [
        ...new Set(
            allCourses
                .map(course => course.category)
                .filter(Boolean)
        )
    ];

    const levels = [
        ...new Set(
            allCourses
                .map(course => course.level)
                .filter(Boolean)
        )
    ];

    categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
    });

    levels.forEach(level => {
        const option = document.createElement("option");
        option.value = level;
        option.textContent = level;
        levelFilter.appendChild(option);
    });
}


function renderCourses(courses) {
    courseCount.textContent = `共 ${courses.length} 門課程`;

    if (!courses.length) {
        courseGrid.innerHTML = `
            <div class="course-empty">
                找不到符合條件的課程
            </div>
        `;
        return;
    }

    courseGrid.innerHTML = courses.map(course => `
        <article class="course-card">

            ${
                course.image_url
                    ? `
                        <img
                            src="${course.image_url}"
                            alt="${escapeHtml(course.name)}"
                            class="course-image"
                            onerror="this.outerHTML='<div class=\\'course-image-placeholder\\'>圖片暫時無法顯示</div>'"
                        >
                    `
                    : `
                        <div class="course-image-placeholder">
                            暫無課程圖片
                        </div>
                    `
            }

            <div class="course-content">
                <h2 class="course-title">
                    ${escapeHtml(course.name)}
                </h2>

                <div class="course-meta">
                    <span class="tag tag-category">
                        ${escapeHtml(course.category || "未分類")}
                    </span>

                    <span class="tag tag-level">
                        ${escapeHtml(course.level || "未設定")}
                    </span>
                </div>
            </div>

        </article>
    `).join("");
}


function filterCourses() {
    const keyword = searchInput.value.trim().toLowerCase();
    const category = categoryFilter.value;
    const level = levelFilter.value;

    const filtered = allCourses.filter(course => {
        const name = (course.name || "").toLowerCase();

        const matchKeyword =
            !keyword || name.includes(keyword);

        const matchCategory =
            !category || course.category === category;

        const matchLevel =
            !level || course.level === level;

        return matchKeyword && matchCategory && matchLevel;
    });

    renderCourses(filtered);
}


function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


searchInput.addEventListener("input", filterCourses);
categoryFilter.addEventListener("change", filterCourses);
levelFilter.addEventListener("change", filterCourses);

document.addEventListener("DOMContentLoaded", loadCourses);
</script>
{% endblock %}
