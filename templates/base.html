<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Course Management{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            height: 68px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
            color: #111827;
        }

        .brand span {
            color: #ff9900;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            padding: 10px 14px;
            border-radius: 8px;
            color: #4b5563;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .container {
            width: min(1200px, 90%);
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        .card {
            background: white;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            background: #f9fafb;
            color: #374151;
            font-size: 14px;
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 15px 14px;
            border-bottom: 1px solid #f0f1f3;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .status-message {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .error-message {
            color: #dc2626;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background: #ff9900;
            color: #111827;
        }

        .btn-primary:hover {
            background: #e88b00;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-control {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: #ff9900;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .notice {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .notice.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .notice.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 4%;
            }

            .brand {
                font-size: 17px;
            }

            .nav-links {
                gap: 2px;
            }

            .nav-links a {
                padding: 8px;
                font-size: 13px;
            }

            .container {
                width: 94%;
            }

            .table-wrapper {
                overflow-x: auto;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

<nav class="navbar">
    <a href="/" class="brand">
        Course<span>Management</span>
    </a>

    <div class="nav-links">
        <a href="/">首頁</a>
        <a href="/courses-page">課程管理</a>
        <a href="/students-page">學生管理</a>
        <a href="/enrollments-page">報名管理</a>
        <a href="/recommend-page">AI 推薦</a>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}

</body>
</html>
