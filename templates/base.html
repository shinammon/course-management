<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}課程管理系統{% endblock %}</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --purple: #7c3aed;
            --text: #0f172a;
            --text-secondary: #475569;
            --muted: #64748b;
            --border: #e2e8f0;
            --background: #f8fafc;
            --white: #ffffff;
            --shadow: 0 12px 35px rgba(15, 23, 42, .08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
            color: var(--text);
            background: var(--background);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: min(1480px, calc(100% - 48px));
            margin: 0 auto;
        }

        /* =========================
           Navbar
        ========================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-content {
            height: 72px;
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            white-space: nowrap;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--primary-light);
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 26px;
            font-weight: 600;
        }

        .nav-links a {
            color: var(--text-secondary);
            transition: .2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .nav-spacer {
            flex: 1;
        }

        .nav-search {
            width: 250px;
        }

        .nav-search input {
            width: 100%;
            padding: 11px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: white;
        }

        .nav-search input:focus {
            border-color: var(--primary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        /* =========================
           一般管理頁面共用
        ========================= */

        .page-container {
            width: min(1200px, calc(100% - 48px));
            margin: 40px auto 70px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .page-header p {
            margin: 0;
            color: var(--muted);
        }

        .card {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: white;
            box-shadow: var(--shadow);
        }

        .form-control {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 14px;
            text-align: left;
            background: #f8fafc;
            color: #334155;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 15px 14px;
            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .status-message {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        .error-message {
            color: #dc2626;
        }

        .notice {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 10px;
        }

        .notice.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .notice.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        /* =========================
           Footer
        ========================= */

        footer {
            padding: 30px 0;
            background: #0f172a;
            color: #cbd5e1;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 950px) {
            .nav-links,
            .nav-search {
                display: none;
            }
        }

        @media (max-width: 650px) {
            .container,
            .page-container {
                width: calc(100% - 24px);
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

<header class="navbar">
    <div class="container nav-content">

        <a href="/" class="brand">
            <span class="brand-icon">📖</span>
            課程管理系統
        </a>

        <nav class="nav-links">

            <a
                href="/"
                class="{% if request.path == '/' %}active{% endif %}"
            >
                首頁
            </a>

            <a
                href="/courses-page"
                class="{% if request.path == '/courses-page' %}active{% endif %}"
            >
                課程管理
            </a>

            <a
                href="/students-page"
                class="{% if request.path == '/students-page' %}active{% endif %}"
            >
                學生管理
            </a>

            <a
                href="/enrollments-page"
                class="{% if request.path == '/enrollments-page' %}active{% endif %}"
            >
                報名管理
            </a>

            <a href="/#ai">
                AI 推薦
            </a>

        </nav>

        <div class="nav-spacer"></div>

        <div class="nav-search">
            <input
                id="topSearch"
                type="text"
                placeholder="搜尋課程..."
            >
        </div>

        <div class="avatar">
            U
        </div>

    </div>
</header>


{% block main %}

<main class="page-container">
    {% block content %}{% endblock %}
</main>

{% endblock %}


<footer>
    <div class="container">
        課程管理系統 · Flask · AWS · RDS · S3 · Bedrock · CI/CD
    </div>
</footer>


<script>
    const topSearch = document.getElementById("topSearch");

    if (topSearch) {
        topSearch.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                const keyword = topSearch.value.trim();

                if (window.location.pathname !== "/") {
                    window.location.href =
                        "/courses-page?search=" +
                        encodeURIComponent(keyword);
                }

            }

        });
    }
</script>

{% block scripts %}{% endblock %}

</body>

</html>
