{% extends "base.html" %}

{% block title %}學生管理 | 課程管理系統{% endblock %}


{% block head %}

<style>
    .student-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
    }

    .student-count {
        color: var(--muted);
        font-size: 14px;
    }

    .student-search {
        width: min(320px, 100%);
    }

    @media (max-width: 650px) {
        .student-toolbar {
            flex-direction: column;
            align-items: stretch;
        }

        .student-search {
            width: 100%;
        }
    }
</style>

{% endblock %}


{% block content %}

<div class="page-header">
    <h1>學生管理</h1>
    <p>查看目前系統中的學生基本資料。</p>
</div>


<div class="student-toolbar">

    <div
        id="studentCount"
        class="student-count"
    >
        學生資料載入中...
    </div>

    <input
        id="studentSearch"
        class="form-control student-search"
        type="text"
        placeholder="搜尋姓名或 Email..."
    >

</div>


<div class="card">

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>學生 ID</th>
                    <th>姓名</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">

                <tr>
                    <td
                        colspan="3"
                        class="status-message"
                    >
                        載入學生資料中...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>
    let allStudents = [];

    const studentTableBody =
        document.getElementById(
            "studentTableBody"
        );

    const studentSearch =
        document.getElementById(
            "studentSearch"
        );

    const studentCount =
        document.getElementById(
            "studentCount"
        );


    async function loadStudents() {

        try {

            const response =
                await fetch("/students");

            if (!response.ok) {
                throw new Error(
                    "無法取得學生資料"
                );
            }

            allStudents =
                await response.json();

            renderStudents(
                allStudents
            );

        } catch (error) {

            console.error(error);

            studentCount.textContent =
                "無法取得學生資料";

            studentTableBody.innerHTML = `
                <tr>
                    <td
                        colspan="3"
                        class="status-message error-message"
                    >
                        學生資料載入失敗
                    </td>
                </tr>
            `;

        }

    }


    function renderStudents(students) {

        studentCount.textContent =
            `共 ${students.length} 位學生`;


        if (!students.length) {

            studentTableBody.innerHTML = `
                <tr>
                    <td
                        colspan="3"
                        class="status-message"
                    >
                        找不到符合條件的學生
                    </td>
                </tr>
            `;

            return;

        }


        studentTableBody.innerHTML =
            students.map(student => `
                <tr>

                    <td>
                        ${escapeHtml(student.id)}
                    </td>

                    <td>
                        ${escapeHtml(student.name)}
                    </td>

                    <td>
                        ${escapeHtml(student.email)}
                    </td>

                </tr>
            `).join("");

    }


    function filterStudents() {

        const keyword =
            studentSearch
                .value
                .trim()
                .toLowerCase();


        if (!keyword) {

            renderStudents(
                allStudents
            );

            return;

        }


        const filteredStudents =
            allStudents.filter(student => {

                const searchText = [
                    student.name,
                    student.email
                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                return searchText.includes(
                    keyword
                );

            });


        renderStudents(
            filteredStudents
        );

    }


    function escapeHtml(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    studentSearch.addEventListener(
        "input",
        filterStudents
    );


    document.addEventListener(
        "DOMContentLoaded",
        loadStudents
    );
</script>

{% endblock %}
